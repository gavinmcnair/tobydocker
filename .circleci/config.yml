version: 2.1

executors:
  docker-executor:
    docker:
      - image: circleci/golang:1.25.1  # Use the official Go image

jobs:
  build:
    executor: docker-executor
    steps:
      - checkout  # Check out the source code
      - run:
          name: Set up Docker
          command: |
            echo "Setting up Docker..."
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo service docker start

      - run:
          name: Build Docker Image
          command: |
            docker build -t hellotoby .

      - run:
          name: Run Tests (Optional)
          command: |
            # Run your tests here if you have any
            # For example, if you have tests in your Go application:
            go test ./...

      - run:
          name: Push Docker Image
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker tag hellotoby $DOCKER_USERNAME/hellotoby:latest
            docker push $DOCKER_USERNAME/hellotoby:latest

workflows:
  version: 2
  build_and_push:
    jobs:
      - build
